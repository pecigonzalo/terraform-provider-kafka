# golangci-lint v2 configuration.
# Keep this minimal: add linters deliberately rather than enabling everything.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - fatcontext
    - intrange
    - misspell
    - modernize
    - nilerr
    - usestdlibvars

formatters:
  enable:
    - gofmt
